<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Notes</title>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f9f9f9;
      color: #222;
    }
    h1 { margin-bottom: 16px; }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      margin-top: 8px;
      padding: 10px 20px;
      font-size: 1rem;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    #notes-list { margin-top: 32px; }
    .note-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }
    #status { margin-top: 8px; font-size: 0.9rem; color: #555; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>My Notes</h1>

  <textarea id="note-input" placeholder="Write your note here..."></textarea>
  <br />
  <button onclick="saveNote()">Save Note</button>
  <div id="status"></div>

  <h2>Saved Notes</h2>
  <div id="notes-list">Loading...</div>

  <script src="script.js"></script>
</body>
</html>
